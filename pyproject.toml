[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fnirs-ai-helper"
version = "0.1.0"
description = "A local-first, documentation-grounded fNIRS analysis Q&A prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.0",
    "httpx>=0.27",
    "keyring>=25.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fnirs-ai-helper = "fnirs_ai_helper.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
